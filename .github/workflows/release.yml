name: Release

# NOTE: the AWS deploy job is added here after client approval.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('apps/web/package.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build web app
        if: hashFiles('apps/web/package.json') != ''
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Package assets
        run: |
          mkdir -p release
          git archive --format=zip --prefix="pro-label-automation-${GITHUB_REF_NAME}/" \
            -o "release/pro-label-automation-${GITHUB_REF_NAME}-source.zip" HEAD
          if [ -d apps/web/dist ]; then
            (cd apps/web/dist && zip -qr "../../../release/web-dist-${GITHUB_REF_NAME}.zip" .)
          fi
          ls -l release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
