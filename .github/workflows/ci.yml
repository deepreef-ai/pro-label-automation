name: CI

on:
  pull_request:
    branches: [main, dev]
    # "edited" re-runs the integrity check when the PR title changes ([tests], [ci], ...).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Integrity check (PR diff)
        if: github.event_name == 'pull_request'
        env:
          # Passed via env (never inlined into the script) so a PR title cannot inject shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/ci/integrity.py --base origin/${{ github.base_ref }}
      - name: Integrity check (scan whole tree)
        if: github.event_name == 'push'
        run: python scripts/ci/integrity.py --scan

  backend:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check apps/api tests
      - name: Unit tests + rules coverage
        run: >-
          pytest tests/unit -q -p no:cacheprovider
          --disable-socket --allow-unix-socket
          --cov=apps/api/core/rules --cov-report=term-missing --cov-fail-under=90

  # Not continue-on-error: whether this blocks merging is decided by branch protection.
  # It becomes a REQUIRED check once the API PR (A1) merges and the endpoints exist.
  integration:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r requirements-dev.txt
      - name: Integration tests
        run: pytest tests/integration -q --disable-socket --allow-unix-socket

  web:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice (web app not added yet)
        if: hashFiles('apps/web/package.json') == ''
        working-directory: .
        run: echo "::notice::apps/web/package.json not found - web checks skipped until the web app PR lands."
      - uses: actions/setup-node@v4
        if: hashFiles('apps/web/package.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        if: hashFiles('apps/web/package.json') != ''
        run: npm ci
      - name: Typecheck
        if: hashFiles('apps/web/package.json') != ''
        run: npm run typecheck
      - name: Lint
        if: hashFiles('apps/web/package.json') != ''
        run: npm run lint
      - name: Build
        if: hashFiles('apps/web/package.json') != ''
        run: npm run build
      - name: Install Playwright browser
        if: hashFiles('apps/web/package.json') != ''
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        if: hashFiles('apps/web/package.json') != ''
        run: npm run test:e2e
