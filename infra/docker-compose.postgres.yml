# PostgreSQL + row-level security option (issue #55 B3). Not needed on the demo laptop (SQLite).
#   cp .env.example .env    # at the repo root
#   docker compose -f infra/docker-compose.postgres.yml up --build
# API: http://localhost:8000   Postgres: localhost:5432 (owner `labels`, API role `label_app`)
# Start over (drop the data):  docker compose -f infra/docker-compose.postgres.yml down -v
name: pro-label-automation-pg

x-api-image: &api-build
  context: ..
  dockerfile: infra/api.Dockerfile

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: labels
      POSTGRES_USER: labels                                  # owner / superuser: init only
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:-labels}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labels -d labels"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: build the synthetic demo DB into Postgres (first run), apply RLS policies,
  # create the non-superuser API role and check that RLS bites. Exits 0 when OK.
  init:
    build: *api-build
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://labels:${PG_OWNER_PASSWORD:-labels}@db:5432/labels
      APP_DB_USER: label_app
      APP_DB_PASSWORD: ${PG_APP_PASSWORD:-label_app}
    command: ["python", "infra/postgres/init_rls.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    env_file: ../.env
    environment:
      # The API connects as the RLS-bound role, never as the owner (superusers bypass RLS).
      DATABASE_URL: postgresql+psycopg://label_app:${PG_APP_PASSWORD:-label_app}@db:5432/labels
      LLM_CACHE_PATH: data/llm_cache.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--app-dir", "apps/api", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Agents per company: import_checker every 15 min, all agents 08:00, owner brief 09:00 (IST).
  scheduler:
    build: *api-build
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://label_app:${PG_APP_PASSWORD:-label_app}@db:5432/labels
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "agents.scheduler", "--company", "all"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
