components:
  parameters:
    XRole:
      name: X-Role
      in: header
      required: false
      description: Demo role. Missing = owner.
      schema:
        type: string
        enum:
        - owner
        - ppic
        - design
        - store
        - production
        - qc
        - dispatch
        - accounts
        - marketing
  responses:
    BadRequest:
      description: Validation or business rule broken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 'Role not allowed: {"detail":"forbidden for role <r>"}'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Guard failed (e.g. dispatch above QC approved)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: Error body for 400/403/404/409
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          type: string
        time:
          type: string
          format: date-time
        db:
          type: string
          enum:
          - ok
          - down
        ai_mode:
          type: string
          enum:
          - cloud
          - local
          - 'off'
        demo:
          type: boolean
          description: demo data loaded
      required:
      - status
      - version
      - time
      - db
      - ai_mode
      - demo
    SearchResult:
      type: object
