      operationId: post_jobs_from_po
      x-roles:
      - owner
      - ppic
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentMediaType: application/pdf
                  description: PO PDF
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoDraft'
        '400':
