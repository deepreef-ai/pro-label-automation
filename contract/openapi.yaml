  /api/jobs:
    get:
      tags:
      - Jobs
      summary: Job register
      operationId: get_jobs
      x-roles:
      - owner
      - ppic
      - design
      - store
      - production
      - qc
      - dispatch
      - accounts
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - planned
          - design
          - printing
          - qc
          - dispatch
          - invoiced
          - closed
          - hold
          description: planned = PO accepted, waiting for design/material; design = artwork/proof/plates; printing
            = on press; qc = printed, inspection open; dispatch = QC approved, dispatch open; invoiced; closed =
            paid; hold
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Text search on job card, client, product, PO
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Jobs
      summary: Create job card
      operationId: post_jobs
      x-roles:
      - owner
      - ppic
      description: 409 if the client is LOCKED or the PO number already exists for the client.
      parameters:
      - $ref: '#/components/parameters/XRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
