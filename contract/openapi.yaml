# Shared API contract. Generated from SPEC.md decisions; edit via a [contract] PR.
openapi: 3.1.0
info:
  title: Pro Label Automation demo API
  version: 0.1.0
  description: 'Shared contract. Source of truth: contract/SPEC.md. Money in rupees (2 dp), dates ISO. Every operation
    lists allowed X-Role values in `x-roles` (owner may call everything). Change only via a `[contract]` PR.'
servers:
- url: http://localhost:8000
tags:
- name: Shell
- name: Dashboard
- name: Masters
- name: Marketing
- name: Jobs
- name: Design
- name: Store
- name: Production
- name: QC
- name: Dispatch
- name: Money
- name: Agents
- name: Floor
- name: Chat
paths:
  /api/health:
    get:
      tags:
      - Shell
      summary: Liveness + mode
      operationId: get_health
      x-roles:
      - owner
      - ppic
      - design
      - store
      - production
      - qc
      - dispatch
      - accounts
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/search:
    get:
      tags:
      - Shell
      summary: Global search (jobs, clients, invoices, rolls...)
      operationId: get_search
      x-roles:
      - owner
      - ppic
      - design
      - store
      - production
      - qc
      - dispatch
      - accounts
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search text, min 2 chars
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/settings:
    get:
      tags:
      - Shell
      summary: Tolerances and switches
      operationId: get_settings
      x-roles:
      - owner
      - ppic
      - design
      - store
      - production
      - qc
      - dispatch
      - accounts
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Shell
      summary: Update settings (owner only)
      operationId: put_settings
      x-roles:
      - owner
      parameters:
      - $ref: '#/components/parameters/XRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/feedback:
    post:
      tags:
      - Shell
      summary: Send demo feedback
      operationId: post_feedback
      x-roles:
      - owner
      - ppic
      - design
      - store
      - production
      - qc
      - dispatch
      - accounts
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Shell
      summary: List feedback
      operationId: get_feedback
      x-roles:
      - owner
      - ppic
      - design
      - store
      - production
      - qc
      - dispatch
      - accounts
      - marketing
      parameters:
      - $ref: '#/components/parameters/XRole'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: KPIs for a period
      operationId: get_dashboard_summary
      x-roles:
      - owner
      - accounts
      parameters:
      - $ref: '#/components/parameters/XRole'
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - today
          - month
          - year
        description: Default month
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/alerts:
